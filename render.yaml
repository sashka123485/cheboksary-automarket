# Cheboksary AutoMarket

Онлайн-игра/маркетплейс автомобилей для Чебоксар.

## GitHub
Загрузите все файлы проекта в репозиторий GitHub. Не загружайте `automarket.db` или другие секреты.

## Render
1. Создайте Web Service на Render.
2. Подключите GitHub-репозиторий.
3. Build Command: `npm install`
4. Start Command: `npm start`
5. Node.js 18+ (в проекте указано >=18; Render YAML предлагает Node 20).

## Администратор
Логин: `Sasha67`
Пароль: `Sasha67`

Перед публичным запуском рекомендуется сменить пароль и вынести его в переменные окружения.

## Важно про базу
Текущая версия использует SQLite-файл `automarket.db`. На Render локальная файловая система Web Service не предназначена для постоянного хранения данных после деплоев/перезапусков. Для настоящего постоянного онлайна лучше заменить SQLite на PostgreSQL (Render Postgres) и хранить данные игроков там.

## Возможности
- стартовые 100 000 ₽;
- стартовая Lada Granta;
- рынок между игроками;
- покупка/продажа машин;
- гаражи;
- предметы;
- квартира в центре Чебоксар за 2 500 000 ₽;
- админ-панель;
- Socket.IO.
